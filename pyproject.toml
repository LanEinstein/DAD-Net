[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dadnet"
version = "1.0.0"
description = "DAD-Net: a distribution-aligned dual-stream framework for micro-expression recognition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Lan Zhang"},
]
keywords = [
    "micro-expression recognition",
    "knowledge distillation",
    "optimal transport",
    "optical flow",
    "affective computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
preprocess = [
    "opencv-python>=4.5.0",
    "opencv-contrib-python>=4.5.0",
    "dlib>=19.22.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/LanEinstein/DAD-Net"
Repository = "https://github.com/LanEinstein/DAD-Net"
Issues = "https://github.com/LanEinstein/DAD-Net/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dadnet*"]

[tool.ruff]
line-length = 100
target-version = "py38"
